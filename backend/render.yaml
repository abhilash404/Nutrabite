services:
  - type: web
    name: nutrabite-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nutrabite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: nutrabite-db
    plan: free